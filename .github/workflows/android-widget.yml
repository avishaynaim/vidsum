name: Android widget

# Builds the YT Summary home-screen widget app (android-widget/) and publishes the APK as the
# "widget-latest" release, so the phone always downloads the newest one from the same link.
on:
  push:
    branches: [main]
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One fixed signing key (repository secrets), so each new APK installs over the last one.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.WIDGET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/widget.jks"
            echo "WIDGET_KEYSTORE_FILE=$RUNNER_TEMP/widget.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::WIDGET_KEYSTORE_B64 is not set; the APK is unsigned"
          fi

      - name: Build
        env:
          WIDGET_KEYSTORE_PASSWORD: ${{ secrets.WIDGET_KEYSTORE_PASSWORD }}
          WIDGET_KEY_ALIAS: ${{ secrets.WIDGET_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release*.apk "$RUNNER_TEMP/yt-summary-widget.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: yt-summary-widget
          path: ${{ runner.temp }}/yt-summary-widget.apk

      - name: Publish the widget-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view widget-latest >/dev/null 2>&1 || \
            gh release create widget-latest --title "YT Summary widget (latest)" \
              --notes "The Android home-screen widget for the YT Summary dashboard. Install yt-summary-widget.apk on the phone." --latest=false
          gh release upload widget-latest "$RUNNER_TEMP/yt-summary-widget.apk" --clobber
